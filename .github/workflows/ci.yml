# Intégration continue : à chaque push et pull request, le pipeline complet est
# rejoué sur un échantillon synthétique (sans S3), puis vérifié par DuckDB.
name: CI pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4      # Spark tourne sur la JVM
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            src/requirements.txt
            tests/requirements-ci.txt

      - name: Dépendances
        run: pip install -r src/requirements.txt -r tests/requirements-ci.txt

      - name: Lint
        run: make lint

      - name: Tests (pipeline Spark + vérification DuckDB + relance d'une table)
        run: make test

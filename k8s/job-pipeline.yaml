# Job Kubernetes : pipeline Spark bronze -> silver -> gold (Spark en mode local dans le pod)
# Prérequis : ConfigMap "conso-code" (code src/) et Secret "s3-credentials" (voir src/run_k8s.sh)
apiVersion: batch/v1
kind: Job
metadata:
  name: conso-pipeline
  labels:
    app: conso-communes
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: conso-communes
        component: spark-pipeline
    spec:
      restartPolicy: Never
      containers:
        - name: spark
          image: apache/spark:3.5.1-scala2.12-java17-python3-ubuntu
          command: ["/bin/bash", "-c"]
          args:
            - >-
              /opt/spark/bin/spark-submit
              --master local[2]
              --conf spark.jars.ivy=/tmp/.ivy2
              --packages org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262
              /app/spark_pipeline.py --stage ${STAGE}
          env:
            - name: STAGE
              value: "all"            # bronze | silver | gold | all (relance d'une étape)
            - name: HOME
              value: /tmp
          envFrom:
            - configMapRef:
                name: conso-params
            - secretRef:
                name: s3-credentials
          volumeMounts:
            - name: code
              mountPath: /app
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 4Gi}
      volumes:
        - name: code
          configMap:
            name: conso-code
